<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 보안 정책(CSP): 이 앱이 불러올 수 있는 것을 "내 파일 + 내 Supabase" 로만 제한합니다.
       외부에서 몰래 코드를 끼워 넣는 공격(XSS)이 성공해도 실행되지 못하게 하는 안전장치입니다.
       배포 서버 헤더(_headers / vercel.json)에도 같은 규칙이 더 엄격하게 들어 있습니다. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://*.supabase.co https://*.visitkorea.or.kr; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://tiles.openfreemap.org https://photon.komoot.io https://nominatim.openstreetmap.org; worker-src 'self' blob:; child-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#7459d9">
  <meta name="description" content="A friendly community for travelers exploring Korea.">
  <title>KoreaLink</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/features.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <div id="splash" class="boot-splash" aria-hidden="true"></div>
  <a class="skip-link" href="#view">Skip to content</a>
  <header id="header" class="site-header"></header>
  <main id="view" class="view" tabindex="-1"></main>
  <footer id="footer" class="site-footer"></footer>
  <nav id="bottom-nav" class="bottom-nav"></nav>
  <noscript><p class="noscript">This app needs JavaScript. / 이 앱은 자바스크립트가 필요합니다.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
